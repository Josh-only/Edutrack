services:
  - type: web
    name: edutrack-api
    runtime: node
    rootDir: student-management-api
    buildCommand: npm ci && npm run build
    startCommand: npm run migration:run && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: edutrack-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: edutrack-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: edutrack-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: edutrack-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: edutrack-db
